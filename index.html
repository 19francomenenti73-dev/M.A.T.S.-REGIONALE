<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATS R3 - Meteosat Advanced Tracking System</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #000306;
            color: #fff;
            overflow: hidden;
        }

        .wrap {
            width: 100%;
            height: 100%;
        }

        /* Header MATS */
        .mats-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            text-align: center;
            pointer-events: none;
            background: rgba(30, 30, 30, 0.85);
            padding: 8px 24px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .mats-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00cfff;
        }

        .mats-subtitle {
            font-size: 10px;
            font-weight: 700;
            color: #00cfff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Navbar Regioni Superiore */
        .region-nav {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 95vw;
            padding: 6px 12px;
            background: rgba(15, 15, 15, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            scrollbar-width: none;
        }

        .region-nav::-webkit-scrollbar { display: none; }

        .region-btn {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .region-btn:hover, .region-btn.active {
            background: #00cfff;
            color: #000;
            border-color: #00cfff;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
        }

        /* Banner Inferiore */
        .mop-banner {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
            white-space: nowrap;
        }

        /* Modale Viewer 3D */
        .viewer-3d-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 20000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-info-bar {
            position: absolute;
            top: 15px;
            left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(15, 15, 15, 0.95);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            color: #00cfff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .meteo-grid-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px 12px;
            font-size: 10.5px;
            color: #ddd;
            margin-top: 4px;
        }

        .close-btn {
            background: #ff3b30;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .canvas-3d-container {
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            position: relative;
        }

        .canvas-3d-container:active { cursor: grabbing; }

        .holo-toggle-btn {
            position: absolute;
            bottom: 20px;
            background: linear-gradient(45deg, #00cfff, #007fff);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
        }

        .controls-hint {
            position: absolute;
            bottom: 70px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
        }

        /* Marker Centroide Dinamico */
        .centroid-pulse {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="mats-header">
        <div class="mats-title">MATS</div>
        <div class="mats-subtitle">Meteosat Advanced Tracking System</div>
    </div>

    <div class="region-nav" id="region-nav-container">
        <button class="region-btn active" onclick="filterRegion('Nazionale', this)">Nazionale</button>
    </div>

    <div class="wrap" id="map"></div>

    <div class="mop-banner">
        <span>Strutture Attive: <b id="total-count" style="color:#00cfff;">0</b></span>
        <span>Aggiornamento: <b id="last-update"></b></span>
    </div>

    <!-- Viewer 3D -->
    <div id="viewer-3d-modal" class="viewer-3d-modal">
        <div class="modal-info-bar">
            <div>
                <div id="model-cell-id" style="font-size: 16px; color: #00cfff;">CELL ID</div>
                <div class="meteo-grid-info" id="meteo-grid-details"></div>
            </div>
            <button class="close-btn" onclick="closeViewer()">CHIUDI [X]</button>
        </div>
        <div class="canvas-3d-container">
            <canvas id="viewer-canvas"></canvas>
            <button class="holo-toggle-btn" id="holo-btn" onclick="toggleHologramMode()">DISATTIVA WIREFRAME 3D</button>
        </div>
        <div class="controls-hint">Trascina per ruotare a 360° | AnCORATO al centro</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const regionList = [
            "Abruzzo", "Basilicata", "Calabria", "Campania", "Emilia-Romagna",
            "Friuli-Venezia Giulia", "Lazio", "Liguria", "Lombardia", "Marche",
            "Molise", "Piemonte", "Puglia", "Sardegna", "Sicilia",
            "Toscana", "Trentino-Alto Adige", "Umbria", "Valle d'Aosta", "Veneto"
        ];

        const regionCoords = {
            "Abruzzo": [42.35, 13.4], "Basilicata": [40.64, 16.03], "Calabria": [39.3, 16.3],
            "Campania": [40.85, 14.25], "Emilia-Romagna": [44.49, 11.34], "Friuli-Venezia Giulia": [46.06, 13.23],
            "Lazio": [41.9, 12.5], "Liguria": [44.4, 8.93], "Lombardia": [45.46, 9.19],
            "Marche": [43.61, 13.51], "Molise": [41.56, 14.66], "Piemonte": [45.07, 7.68],
            "Puglia": [41.12, 16.86], "Sardegna": [40.22, 9.08], "Sicilia": [37.59, 14.01],
            "Toscana": [43.77, 11.25], "Trentino-Alto Adige": [46.49, 11.35], "Umbria": [43.11, 12.38],
            "Valle d'Aosta": [45.73, 7.31], "Veneto": [45.44, 12.31]
        };

        let currentActiveRegion = 'Nazionale';
        const navContainer = document.getElementById('region-nav-container');
        regionList.forEach(reg => {
            let btn = document.createElement('button');
            btn.className = 'region-btn';
            btn.innerText = reg;
            btn.onclick = (e) => filterRegion(reg, e.target);
            navContainer.appendChild(btn);
        });

        function filterRegion(regiano, btnElement) {
            currentActiveRegion = regiano;
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            if (regiano === 'Nazionale') {
                map.setView([42.5, 12.5], 6);
            } else if (regionCoords[regiano]) {
                map.setView(regionCoords[regiano], 8);
            }
            if (window.lastLoadedData) renderRegionsData(window.lastLoadedData);
        }

        var map = L.map('map', {zoomControl: false}).setView([42.5, 12.5], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        let radarlayer = L.layerGroup().addTo(map);
        let vectorsLayer = L.layerGroup().addTo(map);

        // Mappatura Rigorosa Colori della Riflettività SRZ
        function getColor(val) {
            if (val > 14) return "#ff00ff"; // Magenta (Grandine / Core Potente)
            if (val > 10) return "#ff3000"; // Rosso (Severo)
            if (val > 6)  return "#ff7200"; // Arancione (Intenso)
            if (val > 3)  return "#ffcc00"; // Giallo (Moderato)
            if (val > 0)  return "#00ee00"; // Verde (Pioggia)
            return "#93bfff";                 // Celeste (Debole)
        }

        function getDolColor(hex, alpha) {
            if (hex === '#ff00ff') return `rgba(255, 0, 255, ${alpha})`;
            if (hex === '#ff3000') return `rgba(255, 48, 0, ${alpha})`;
            if (hex === '#ff7200') return `rgba(255, 114, 0, ${alpha})`;
            if (hex === '#ffcc00') return `rgba(255, 204, 0, ${alpha})`;
            if (hex === '#00ee00') return `rgba(0, 238, 0, ${alpha})`;
            return `rgba(0, 191, 255, ${alpha})`;
        }
                // Estrae il colore della massima riflettività presente nella matrice delle celle
        function getMaxCoreColor(track) {
            let maxVal = 0;
            let matrix = track.grid_matrix || [];
            matrix.forEach(row => {
                row.forEach(val => { if (val > maxVal) maxVal = val; });
            });
            return getColor(maxVal);
        }

        async function loadMasterData() {
            try {
                let res = await fetch('centrones.json?t=' + Date.now());
                if (!res.ok) throw new Error("Errore dati");
                let data = await res.json();
                window.lastLoadedData = data;
                renderRegionsData(data);
            } catch (err) {
                console.log("In attesa dati...", err);
            }
        }

        function getOffsetBearing(lat, lon, bearing, distanceKm) {
            const R = 6371;
            const rad = Math.PI / 180;
            const d = distanceKm / R;
            const brng = bearing * rad;
            const lat1 = lat * rad;
            const lon1 = lon * rad;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
            const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

            return [lat2 / rad, lon2 / rad];
        }

        function renderRegionsData(data) {
            radarlayer.clearLayers();
            vectorsLayer.clearLayers();

            if (data.radar_tile && data.radar_tile.host && data.radar_tile.path) {
                let radarUrl = data.radar_tile.host + data.radar_tile.path + '/256/{z}/{x}/{y}/2/1_1.png';
                let rlayer = L.tileLayer(radarUrl, { opacity: 0.65, zIndex: 200 });
                radarlayer.addLayer(rlayer);
            }

            let structures = data.mats_structures || data.structures || [];
            document.getElementById('total-count').innerText = structures.length;
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

            structures.forEach(track => {
                let center = track.center;
                if (!center || center.length < 2) return;

                if (currentActiveRegion !== 'Nazionale') {
                    let coords = regionCoords[currentActiveRegion];
                    if (coords) {
                        let dist = Math.abs(center[0] - coords[0]) + Math.abs(center[1] - coords[1]);
                        if (dist > 3.2) return;
                    }
                }

                // COLORE RIGOROSO IN BASE ALLA RIFLETTIVITÀ MASSIMA DEL CORE
                let coreMaxColor = getMaxCoreColor(track);
                let coreBgFill = getDolColor(coreMaxColor, 0.22);

                // 1. Vettore reale percorso
                if (track.actual_path && track.actual_path.length > 0) {
                    let fullPath = [center, ...track.actual_path];
                    L.polyline(fullPath, { color: coreMaxColor, weight: 4, opacity: 0.85 }).addTo(vectorsLayer);
                }

                // 2. Cono predittivo NOWAA a 6 ore con COLORE RIGOROSO DEL CORE
                let speedKmh = track.speed_kmh || 40;
                let dirDeg = track.direction_deg || 45;
                let lat0 = center[0], lon0 = center[1];

                let predPoints = [[lat0, lon0]];
                let coneLeft = [], coneRight = [];

                for (let h = 1; h <= 6; h++) {
                    let dist = speedKmh * h;
                    let pos = getOffsetBearing(lat0, lon0, dirDeg, dist);
                    predPoints.push(pos);

                    let coneRadius = 5 + (h * 6);
                    let left = getOffsetBearing(pos[0], pos[1], dirDeg - 90, coneRadius);
                    let right = getOffsetBearing(pos[0], pos[1], dirDeg + 90, coneRadius);

                    coneLeft.push(left);
                    coneRight.unshift(right);

                    if (h === 1 || h === 3 || h === 6) {
                        L.circleMarker(pos, { radius: 4, color: coreMaxColor, fillColor: coreMaxColor, fillOpacity: 0.8 })
                            .bindTooltip(`+${h}h (${Math.round(dist)}km)`, { permanent: false, direction: 'top' })
                            .addTo(vectorsLayer);
                    }
                }

                // Poligono Cono NOWAA con il colore del nucleo (es. Magenta per celle severe)
                let conePolygon = [[lat0, lon0], ...coneLeft, ...coneRight];
                L.polygon(conePolygon, {
                    color: coreMaxColor,
                    weight: 2,
                    dashArray: '4, 4',
                    fillColor: coreMaxColor,
                    fillOpacity: 0.12
                }).addTo(vectorsLayer);

                L.polyline(predPoints, { color: coreMaxColor, weight: 2, dashArray: '6, 6' }).addTo(vectorsLayer);

                // Centroide marker con lo stesso colore del tiro/core
                let customIconHtml = `<div class="centroid-pulse" style="background:${coreMaxColor}; box-shadow:0 0 12px ${coreMaxColor};"></div>`;
                let centroidIcon = L.divIcon({
                    className: 'custom-centroid-node',
                    html: customIconHtml,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                let marker = L.marker([center[0], center[1]], { icon: centroidIcon }).addTo(vectorsLayer);
                marker.on('click', () => open3DViewer(track));
            });
        }

        var currentTrack = null;
        var rotX = -0.5, rotY = 0.8, isDragging = false, lastMouseX = 0, lastMouseY = 0;
        var isWireframeMode = false;
        var wireframeAnimId = null;
        var rotYAngle = 0;

        function open3DViewer(track) {
            currentTrack = track;
            rotY = 0.8; rotX = -0.5; isWireframeMode = false;
            document.getElementById('holo-btn').innerText = 'ATTIVA WIREFRAME 3D';

            let dbzVal = track.dbz || (40 + Math.round((track.val || 20) % 35));
            let rainRate = Math.round(Math.pow(10, (dbzVal - 10) / 10) / 10);
            let echotopVal = track.echo_top || Math.min(18.0, Math.round((0.5 + (dbzVal / 10.0)) * 10) / 10);
            let hailRisk = (dbzVal > 52) ? "MOLTO ELEVATO (>85%)" : (dbzVal > 46) ? "ELEVATO (60-80%)" : "DEBOLE";
            let hailColor = dbzVal > 52 ? "#ff00ff" : (dbzVal > 46 ? "#ff3000" : "#ffcc00");
            let lightningActivity = dbzVal > 50 ? "POTENTE (>50 st/min)" : (dbzVal > 44 ? "ATTIVA (20-40 st/min)" : "DEBOLE");

            document.getElementById('model-cell-id').innerText = `${track.id | dbzVal} dBZ`;
            document.getElementById('model-cell-details').innerHTML = `
                <div>Riflettività Max: <b style="color:${getMaxCoreColor(track)};">${track.get || dbzVal} dBZ</b></div>
                <div>Rain Rate Previsto: <span style="color:#00cfff;">${rainRate} mm/h</span></div>
                <div>VIL Core / Top: <b>${track.vil || 45} kg/m²</b></div>
                <div>Echo Top (dBZ): <span style="color:#ffcc00;">${echotopVal} km</span></div>
                <div>Rischio Grandine: <span style="color:${hailColor}; font-weight:bold;">${hailRisk}</span></div>
                <div>Attività Fulmini: <b>${lightningActivity}</b></div>
                <div>Vel. Traslazione: <b>${track.speed_kmh || 40} km/h</b></div>
                <div>I-L Core +4h: <b>Target Costiero</b></div>
            `;

            document.getElementById('viewer-3d-modal').style.display = 'flex';
            render3D();
        }

        function closeViewer() {
            document.getElementById('viewer-3d-modal').style.display = 'none';
            if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);
            currentTrack = null; isWireframeMode = false;
        }

        function toggleHologramMode() {
            isWireframeMode = !isWireframeMode;
            document.getElementById('holo-btn').innerText = isWireframeMode ? 'DISATTIVA WIREFRAME 3D' : 'ATTIVA WIREFRAME 3D';
            if (isWireframeMode) {
                runWireframeLoop();
            } else {
                if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);
                render3D();
            }
        }

        var canvas = document.getElementById('viewer-canvas');
        var ctx = canvas.getContext('2d');
        var container = document.getElementById('canvas-3d-container');

        container.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) { isDragging = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; }
        }, { passive: true });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            rotY += (e.clientX - lastMouseX) * 0.01;
            rotX += (e.clientY - lastMouseY) * 0.01;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));
            lastMouseX = e.clientX; lastMouseY = e.clientY;
            if (!isWireframeMode) render3D();
        });

        window.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            let cx = e.touches[0].clientX, cy = e.touches[0].clientY;
            rotY += (cx - lastMouseX) * 0.01;
            rotX += (cy - lastMouseY) * 0.01;
            rotX = Math.max(-1.2, Math.min(1.2, rotX));
            lastMouseX = cx; lastMouseY = cy;
            if (!isWireframeMode) render3D();
        }, { passive: true });

        function render3D() {
            if (!currentTrack) return;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let matrix = currentTrack.grid_matrix || [];
            let rows = matrix.length;
            let cols = rows > 0 ? matrix[0].length : 0;
            let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
            let scale = Math.min(canvas.width, canvas.height) / 22;
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let columnsToDraw = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = matrix[r][c];
                    if (val <= 0) continue;

                    let x = (c - cols / 2 + 0.5) * 1.0;
                    let y = (r - rows / 2 + 0.5) * 1.0;
                    let px_base = cx + (x * cosY - y * sinY) * scale;
                    let py_base = cy + (x * sinY + y * cosY) * sinX * scale;
                    let depth = (x * sinY + y * cosY) * cosX;
                    let h_px = val * scale * 0.75;

                    columnsToDraw.push({
                        color: getColor(val), depth: depth,
                        px_base: px_base, py_base: py_base,
                        px_top: px_base, py_top: py_base - h_px, h_px: h_px
                    });
                }
            }

            columnsToDraw.sort((a, b) => a.depth - b.depth);
            let band = scale * 0.85;

            columnsToDraw.forEach(col => {
                ctx.fillStyle = col.color;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.rect(col.px_base - band / 2, col.py_top, band, col.h_px);
                ctx.fill();
                ctx.stroke();
            });
        }

        function runWireframeLoop() {
            if (!isWireframeMode) return;
            rotYAngle += 0.02;
            rotY += 0.018;

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let matrix = currentTrack.grid_matrix || [];
            let rows = matrix.length;
            let cols = rows > 0 ? matrix[0].length : 0;
            let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
            let scale = Math.min(canvas.width, canvas.height) / 22;
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let columnsToDraw = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = matrix[r][c];
                    if (val <= 0) continue;

                    let x = (c - cols / 2 + 0.5) * 1.0;
                    let y = (r - rows / 2 + 0.5) * 1.0;
                    let px_base = cx + (x * cosY - y * sinY) * scale;
                    let py_base = cy + (x * sinY + y * cosY) * sinX * scale;
                    let depth = (x * sinY + y * cosY) * cosX;
                    let h_px = val * scale * 0.75;

                    columnsToDraw.push({
                        color: getColor(val), depth: depth,
                        px_base: px_base, py_base: py_base,
                        px_top: px_base, py_top: py_base - h_px, h_px: h_px
                    });
                }
            }

            columnsToDraw.sort((a, b) => a.depth - b.depth);
            let band = scale * 0.85;

            columnsToDraw.forEach(col => {
                ctx.fillStyle = getDolColor(col.color, 0.25);
                ctx.strokeStyle = getDolColor(col.color, 0.95);
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.rect(col.px_base - band / 2, col.py_top, band, col.h_px);
                ctx.fill();
                ctx.stroke();
            });

            let stemY = cy - 80 - Math.sin(rotYAngle) * 21 * 10;
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(cx - 100, stemY);
            ctx.lineTo(cx + 100, stemY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            wireframeAnimId = requestAnimationFrame(runWireframeLoop);
        }

        loadMasterData();
        setInterval(loadMasterData, 120000);
    </script>
</body>
</html>
