<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MAtS 3D - Mesoscale Advanced Tracking System</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #000000;
      color: #fff;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    /* Header MAtS */
    .mats-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      text-align: center;
      pointer-events: none;
      background: rgba(10, 10, 10, 0.85);
      padding: 8px 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .mats-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00bfff;
    }
    .mats-subtitle {
      font-size: 10px;
      font-weight: 700;
      color: #00bfff;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    /* Navbar Regioni Superiore */
    .region-nav {
      position: absolute;
      top: 73px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 95vw;
      padding: 6px 12px;
      background: rgba(15, 15, 15, 0.9);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      scrollbar-width: none;
    }
    .region-nav::-webkit-scrollbar { display: none; }
    .region-btn {
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ccc;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .region-btn:hover, .region-btn.active {
      background: #00bfff;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
    }
    /* Banner Inferiore */
    .map-banner {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 11px;
      display: flex;
      gap: 15px;
      align-items: center;
      white-space: nowrap;
    }
    /* Modale Viewer 3D */
    #viewer-3d-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 2000;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    .modal-info-bar {
      position: relative;
      margin-top: 10px;
      width: 92%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: rgba(15, 15, 15, 0.95);
      padding: 10px 14px;
      border-radius: 13px;
      border: 1px solid rgba(0, 191, 255, 0.3);
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      z-index: 2005;
    }
    .meteo-grid-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px 10px;
      font-size: 10px;
      color: #ddd;
      margin-top: 3px;
    }
    .close-btn {
      background: #ff3b30;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    #canvas-3d-container {
      width: 100%;
      height: 48vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      position: relative;
      margin-top: 4px;
    }
    #canvas-3d-container:active { cursor: grabbing; }
    .mode-selector-bar {
      position: relative;
      margin-top: 4px;
      display: flex;
      gap: 5px;
      z-index: 2005;
      background: rgba(10, 10, 10, 0.85);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(0, 191, 255, 0.3);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      justify-content: center;
    }
    .mode-btn {
      background: rgba(30, 30, 30, 0.9);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 9px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: linear-gradient(45deg, #007fff, #00bfff);
      color: #fff;
      border-color: #00ffcc;
      box-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
    }
    .controls-hint {
      margin-top: 3px;
      font-size: 9.5px;
      color: #888;
      text-align: center;
      z-index: 2004;
    }
    .centroid-pulse {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff;
    }
  </style>
</head>
<body>
  <div class="mats-header">
    <div class="mats-title">MAtS</div>
    <div class="mats-subtitle">Mesoscale Advanced Tracking System</div>
  </div>
  <div class="region-nav" id="region-nav-container"></div>
  <div id="map"></div>
  <div class="map-banner">
    <span>Strutture 3D: <b id="total-count" style="color:#00bfff;">0</b></span>
    <span>Aggiornato: <b id="last-update">--</b></span>
  </div>

  <div id="viewer-3d-modal">
    <div class="modal-info-bar">
      <div>
        <b id="modal-cell-id" style="font-size: 14px; color: #00bfff;">Core 3D</b>
        <div class="meteo-grid-info" id="modal-cell-details"></div>
      </div>
      <button class="close-btn" onclick="close3DViewer()">CHIUDI [X]</button>
    </div>
    <div id="canvas-3d-container">
      <canvas id="viewer-canvas"></canvas>
    </div>
    <div class="controls-hint">Trascina per ruotare a 360° | Ancorato al centro</div>
    <div class="mode-selector-bar">
      <button class="mode-btn active" id="btn-mode-voxel" onclick="set3DMode('voxel')">VOXEL 3D</button>
      <button class="mode-btn" id="btn-mode-holo" onclick="set3DMode('holo')">HOLO WIREFRAME</button>
      <button class="mode-btn" id="btn-mode-volumetric" onclick="set3DMode('volumetric')">NUBE VOLUMETRICA</button>
      <button class="mode-btn" id="btn-mode-isosuperfici" onclick="set3DMode('isosuperfici')">FOTOREALISTICO</button>
    </div>
  </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const regionsList = [
      "Abruzzo", "Basilicata", "Calabria", "Campania", "Emilia-Romagna",
      "Friuli-Venezia Giulia", "Lazio", "Liguria", "Lombardia", "Marche",
      "Molise", "Piemonte", "Puglia", "Sardegna", "Sicilia",
      "Toscana", "Trentino-Alto Adige", "Umbria", "Valle d'Aosta", "Veneto"
    ];

    const regionCoords = {
      "Abruzzo": [42.35, 13.41], "Basilicata": [40.64, 16.55], "Calabria": [39.3, 16.5],
      "Campania": [40.85, 14.26], "Emilia-Romagna": [44.49, 11.34], "Friuli-Venezia Giulia": [46.06, 13.23],
      "Lazio": [41.9, 12.51], "Liguria": [44.4, 8.93], "Lombardia": [45.46, 9.19],
      "Marche": [43.61, 13.51], "Molise": [41.56, 14.66], "Piemonte": [45.07, 7.69],
      "Puglia": [41.12, 16.86], "Sardegna": [40.12, 9.01], "Sicilia": [37.59, 14.01],
      "Toscana": [43.76, 11.25], "Trentino-Alto Adige": [46.49, 11.35], "Umbria": [43.11, 12.39],
      "Valle d'Aosta": [45.73, 7.31], "Veneto": [45.44, 12.31]
    };

    let currentActiveRegion = 'Nazionale';
    const navContainer = document.getElementById('region-nav-container');
    
    let natBtn = document.createElement('button');
    natBtn.className = 'region-btn active';
    natBtn.innerText = 'Nazionale';
    natBtn.onclick = (c) => filterRegion('Nazionale', c.target);
    navContainer.appendChild(natBtn);

    regionsList.forEach(reg => {
      let btn = document.createElement('button');
      btn.className = 'region-btn';
      btn.innerText = reg;
      btn.onclick = (c) => filterRegion(reg, c.target);
      navContainer.appendChild(btn);
    });

    function filterRegion(regName, btnElement) {
      currentActiveRegion = regName;
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
      if (regName === 'Nazionale') {
        map.setView([42.5, 12.5], 6);
      } else if (regionCoords[regName]) {
        map.setView(regionCoords[regName], 8);
      }
      if (window.lastLoadedData) renderRegionalData(window.lastLoadedData);
    }

    var map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    let radarLayer = L.layerGroup().addTo(map);
    let vectorsLayer = L.layerGroup().addTo(map);

    function getColor(val) {
      if (val >= 14) return '#ff00ff';
      if (val > 10) return '#ff000d';
      if (val > 8) return '#ff7700';
      if (val > 6) return '#ffcc00';
      if (val > 3) return '#00cc00';
      return '#00bfff';
    }

    function getHoleColor(hex, alpha) {
      if (hex === '#ff00ff') return `rgba(255, 0, 255, ${alpha})`;
      if (hex === '#ff000d') return `rgba(255, 0, 0, ${alpha})`;
      if (hex === '#ff7700') return `rgba(255, 119, 0, ${alpha})`;
      if (hex === '#ffcc00') return `rgba(255, 204, 0, ${alpha})`;
      if (hex === '#00cc00') return `rgba(0, 204, 0, ${alpha})`;
      return `rgba(0, 191, 255, ${alpha})`;
    }

    function getMaxCoreColor(track) {
      let maxVal = 0;
      let matrix = track.grid_matrix || [];
      matrix.forEach(row => {
        row.forEach(val => { if (val > maxVal) maxVal = val; });
      });
      return getColor(maxVal);
    }

    async function loadMasterData() {
      try {
        let res = await fetch('centroids.json?t=' + Date.now());
        if (!res.ok) throw new Error("Errore dati");
        let data = await res.json();
        window.lastLoadedData = data;
        renderRegionalData(data);
      } catch (err) {
        console.log("In attesa dati...", err);
      }
    }

    function getOffsetLatlng(lat, lon, bearing, distanceKm) {
      const R = 6371;
      const rad = Math.PI / 180;
      const d = distanceKm / R;
      const brng = bearing * rad;
      const lat1 = lat * rad;
      const lon1 = lon * rad;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
      return [lat2 / rad, lon2 / rad];
    }

    function renderRegionalData(data) {
      radarLayer.clearLayers();
      vectorsLayer.clearLayers();

      if (data.radar_tile && data.radar_tile.host && data.radar_tile.path) {
        let radarUrl = data.radar_tile.host + data.radar_tile.path + '/256/{z}/{x}/{y}.png';
        let rLayer = L.tileLayer(radarUrl, { opacity: 0.65, zIndex: 200 });
        radarLayer.addLayer(rLayer);
      }

      let structures = data.macro_structures || data.structures || [];
      document.getElementById('total-count').innerText = structures.length;
      document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

      structures.forEach(track => {
        let center = track.center;
        if (!center || center.length < 2) return;

        if (currentActiveRegion !== 'Nazionale') {
          let coords = regionCoords[currentActiveRegion];
          if (coords && Math.abs(center[0] - coords[0]) + Math.abs(center[1] - coords[1]) > 2.2) return;
        }

        let coreHexColor = getMaxCoreColor(track);

        if (track.actual_path && track.actual_path.length > 0) {
          let fullActualPath = [center, ...track.actual_path];
          L.polyline(fullActualPath, { color: '#00bfff', weight: 4, opacity: 0.85 }).addTo(vectorsLayer);
        }

        let lat0 = center[0], lon0 = center[1];
        let speedKmh = track.speed_kmh || 35;
        let dirDeg = track.direction_deg || 45;

        let predPoints = [[lat0, lon0]];
        let coneLeft = [], coneRight = [];
        for (let h = 1; h <= 6; h++) {
          let dist = speedKmh * h;
          let pos = getOffsetLatlng(lat0, lon0, dirDeg, dist);
          predPoints.push(pos);
          let coneRadius = 6 + (h * 8);
          let leftP = getOffsetLatlng(pos[0], pos[1], dirDeg - 90, coneRadius);
          let rightP = getOffsetLatlng(pos[0], pos[1], dirDeg + 90, coneRadius);
          coneLeft.push(leftP);
          coneRight.unshift(rightP);
        }

        let conePolygon = [[lat0, lon0], ...coneLeft, ...coneRight];
        L.polygon(conePolygon, {
          color: coreHexColor,
          weight: 2,
          dashArray: '4, 4',
          fillColor: coreHexColor,
          fillOpacity: 0.22
        }).addTo(vectorsLayer);

        L.polyline(predPoints, { color: coreHexColor, weight: 2, dashArray: '6, 6' }).addTo(vectorsLayer);

        let customIconHtml = `<div class="centroid-pulse" style="background:${coreHexColor};"></div>`;
        let centroidIcon = L.divIcon({ className: 'custom-centroid-node', html: customIconHtml, iconSize: [16, 16], iconAnchor: [8, 8] });
        let marker = L.marker([center[0], center[1]], { icon: centroidIcon }).addTo(vectorsLayer);
        marker.on('click', () => open3DViewer(track));
      });
    }
      </script>
        <script>
    let currentTrack = null;
    let rotX = -0.35, rotY = 0.5, isDragging = false, lastMouseX = 0, lastMouseY = 0;
    let active3DViewMode = 'voxel';
    let wireframeAnimId = null;
    let scanAngle = 0;

    function open3DViewer(track) {
      currentTrack = track;
      rotX = -0.35; rotY = 0.5;
      let modal = document.getElementById('viewer-3d-modal');
      modal.style.display = 'flex';

      setTimeout(() => { set3DMode('voxel'); }, 60);

      let dbzVal = track.dbz || 45;
      let rainRate = Math.round(Math.pow(10, (dbzVal - 16) / 40.0) * 10) / 10;
      let echoTopVal = track.echo_top || 11.7;
      let hailRisk = dbzVal >= 52 ? "MOLTO ELEVATO (>85%)" : (dbzVal >= 46 ? "ELEVATO (>60%)" : "MODERATO");
      let hailColor = dbzVal >= 52 ? "#ff00ff" : (dbzVal >= 46 ? "#ff000d" : "#ffcc00");
      let lightningActivity = dbzVal >= 50 ? "ESTREMA (>50 sf/min)" : "INTENSA";

      document.getElementById('modal-cell-id').innerText = `${track.id || 'Core-51711-9'} | ${dbzVal} dBZ`;
      document.getElementById('modal-cell-details').innerHTML = `
        <div><b>Riflettività Max:</b> <span style="color:${getColor(dbzVal)};">${dbzVal} dBZ</span></div>
        <div><b>Rain Rate Previsto:</b> <span style="color:#00bfff;">${rainRate} mm/h</span></div>
        <div><b>VIL Core:</b> ${track.vil || 67.2} kg/m²</div>
        <div><b>Echo Top (Wd):</b> ${echoTopVal} km</div>
        <div><b>Rischio Grandine:</b> <span style="color:${hailColor};">${hailRisk}</span></div>
        <div><b>Attività Fulmini:</b> ${lightningActivity}</div>
      `;
    }

    function close3DViewer() {
      document.getElementById('viewer-3d-modal').style.display = 'none';
      if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);
      currentTrack = null;
    }

    function set3DMode(mode) {
      active3DViewMode = mode;
      if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);

      ['voxel', 'holo', 'volumetric', 'isosuperfici'].forEach(m => {
        let btn = document.getElementById(`btn-mode-${m}`);
        if(btn) btn.classList.remove('active');
      });
      let activeBtn = document.getElementById(`btn-mode-${mode}`);
      if(activeBtn) activeBtn.classList.add('active');

      if (mode === 'holo') {
        runWireframeLoop();
      } else {
        renderCurrentMode();
      }
    }

    const canvas = document.getElementById('viewer-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-3d-container');

    container.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
    container.addEventListener('touchstart', e => { if(e.touches.length === 1) { isDragging = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; } }, { passive: true });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('touchend', () => { isDragging = false; });

    // ROTAZIONE SOLO ORIZZONTALE SUL PIANO (Bloccata rotazione verticale per evitare capovolgimento)
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      rotY += (e.clientX - lastMouseX) * 0.01;
      lastMouseX = e.clientX; lastMouseY = e.clientY;
      if (active3DViewMode !== 'holo') renderCurrentMode();
    });

    window.addEventListener('touchmove', e => {
      if (!isDragging || e.touches.length !== 1) return;
      let cx = e.touches[0].clientX;
      rotY += (cx - lastMouseX) * 0.01;
      lastMouseX = cx; lastMouseY = e.touches[0].clientY;
      if (active3DViewMode !== 'holo') renderCurrentMode();
    }, { passive: true });

    function updateCanvasSize() {
      let rect = container.getBoundingClientRect();
      let w = rect.width > 0 ? rect.width : window.innerWidth;
      let h = rect.height > 0 ? rect.height : 400;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
    }

    function renderCurrentMode() {
      updateCanvasSize();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentTrack) return;

      if (active3DViewMode === 'voxel') {
        renderVoxelMode();
      } else if (active3DViewMode === 'volumetric') {
        renderVolumetricMode();
      } else if (active3DViewMode === 'isosuperfici') {
        renderPseudo3DMode();
      }
    }

    function getGridStructure() {
      return currentTrack.grid_matrix || [
        [0, 3, 6, 3, 0],
        [3, 8, 11, 8, 3],
        [6, 11, 15, 11, 6],
        [3, 8, 11, 8, 3],
        [0, 3, 6, 3, 0]
      ];
    }

    // 1. VOXEL 3D: Colonne piene e solide, ancorate al centro, vista parziale dall'alto, rotazione orizzontale
    function renderVoxelMode() {
      let matrix = getGridStructure();
      let rows = matrix.length, cols = matrix[0].length;
      let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
      let scale = Math.min(canvas.width, canvas.height) / 22;

      let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      let sinX = Math.sin(rotX), cosX = Math.cos(rotX);

      let items = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let val = matrix[r][c];
          if (val <= 0) continue;
          let x = (c - cols / 2) * scale;
          let y = (r - rows / 2) * scale;

          let rx = x * cosY - y * sinY;
          let ry = x * sinY + y * cosY;

          let px = cx + rx;
          let py = cy + ry * sinX;
          let depth = ry * cosX;
          let height = val * scale * 0.6;

          items.push({
            color: getColor(val),
            depth: depth,
            px: px,
            py: py,
            h: height,
            w: scale * 0.9
          });
        }
      }

      items.sort((a, b) => a.depth - b.depth);

      items.forEach(item => {
        ctx.fillStyle = item.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(item.px - item.w / 2, item.py - item.h, item.w, item.h);
        ctx.fill();
        ctx.stroke();
      });
    }

    // 2. HOLO WIREFRAME: Scheletro a parallelepipedi trasparenti con linea di scansione ciano
    function runWireframeLoop() {
      if (active3DViewMode !== 'holo') return;
      scanAngle += 0.04;
      rotY += 0.005;

      updateCanvasSize();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentTrack) return;

      let matrix = getGridStructure();
      let rows = matrix.length, cols = matrix[0].length;
      let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
      let scale = Math.min(canvas.width, canvas.height) / 22;

      let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      let sinX = Math.sin(rotX), cosX = Math.cos(rotX);

      let items = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let val = matrix[r][c];
          if (val <= 0) continue;
          let x = (c - cols / 2) * scale;
          let y = (r - rows / 2) * scale;

          let rx = x * cosY - y * sinY;
          let ry = x * sinY + y * cosY;

          let px = cx + rx;
          let py = cy + ry * sinX;
          let depth = ry * cosX;
          let height = val * scale * 0.6;

          items.push({
            color: getColor(val),
            depth: depth,
            px: px,
            py: py,
            h: height,
            w: scale * 0.9
          });
        }
      }

      items.sort((a, b) => a.depth - b.depth);

      items.forEach(item => {
        ctx.strokeStyle = item.color;
        ctx.fillStyle = getHoleColor(item.color, 0.1);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.rect(item.px - item.w / 2, item.py - item.h, item.w, item.h);
        ctx.fill();
        ctx.stroke();
      });

      let scanY = cy - 80 + Math.sin(scanAngle) * 90;
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(cx - 120, scanY);
      ctx.lineTo(cx + 120, scanY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      wireframeAnimId = requestAnimationFrame(runWireframeLoop);
    }

    // 3. NUBE VOLUMETRICA: Griglia densa di blocchi stratificati su più livelli
    function renderVolumetricMode() {
      let matrix = getGridStructure();
      let rows = matrix.length, cols = matrix[0].length;
      let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
      let scale = Math.min(canvas.width, canvas.height) / 22;

      let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      let sinX = Math.sin(rotX), cosX = Math.cos(rotX);

      let volumetricBlocks = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let val = matrix[r][c];
          if (val <= 0) continue;
          let x = (c - cols / 2) * scale;
          let y = (r - rows / 2) * scale;

          let rx = x * cosY - y * sinY;
          let ry = x * sinY + y * cosY;

          let px = cx + rx;
          let py = cy + ry * sinX;
          let depth = ry * cosX;
          let totalH = val * scale * 0.6;
          let w = scale * 0.9;

          let numLayers = Math.max(6, Math.floor(val * 0.8));
          let blockH = totalH / numLayers;

          for (let l = 0; l < numLayers; l++) {
            let currentTop = py - (blockH * (l + 1));
            volumetricBlocks.push({
              color: getColor(val),
              depth: depth - (l * 0.02),
              px: px,
              py: currentTop,
              h: blockH,
              w: w
            });
          }
        }
      }

      volumetricBlocks.sort((a, b) => a.depth - b.depth);

      ctx.globalCompositeOperation = 'screen';
      volumetricBlocks.forEach(b => {
        ctx.strokeStyle = b.color;
        ctx.fillStyle = getHoleColor(b.color, 0.35);
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.rect(b.px - b.w / 2, b.py, b.w, b.h);
        ctx.fill();
        ctx.stroke();
      });
      ctx.globalCompositeOperation = 'source-over';
    }

    // 4. FOTOREALISTICO (PSEUDO 3D con BASE RADAR SOLIDA 2D al suolo):
    // - Terreno: mappa di riflettività 2D solida e colorata basata esattamente sulla matrice dati del Tracker.
    // - Nuclei intensi (Giallo/Rosso/Magenta): colonne solide che partono dal terreno.
    // - Bassa riflettività (Azzurro/Verde): volumi trasparenti sospesi in alto.
    function renderPseudo3DMode() {
      let matrix = getGridStructure();
      let rows = matrix.length, cols = matrix[0].length;
      let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
      let scale = Math.min(canvas.width, canvas.height) / 22;

      let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      let sinX = Math.sin(rotX), cosX = Math.cos(rotX);

      // 1. RENDER BASE TERRENO: Mappa radar solida 2D che copia la riflettività della griglia
      let groundItems = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let val = matrix[r][c];
          if (val <= 0) continue;
          let x = (c - cols / 2) * scale;
          let y = (r - rows / 2) * scale;
          let rx = x * cosY - y * sinY;
          let ry = x * sinY + y * cosY;
          let px = cx + rx;
          let py = cy + ry * sinX;
          let depth = ry * cosX;
          let w = scale * 0.95;

          groundItems.push({
            color: getColor(val),
            depth: depth,
            px: px,
            py: py,
            w: w
          });
        }
      }

      // Ordina la base per profondità
      groundItems.sort((a, b) => a.depth - b.depth);

      // Disegna la base solida colorata al suolo
      groundItems.forEach(g => {
        ctx.fillStyle = g.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.rect(g.px - g.w / 2, g.py - 3, g.w, 6);
        ctx.fill();
        ctx.stroke();
      });

      // 2. RENDER STRUTTURA SUPERIORE 3D (Nuclei solidi in basso, strati trasparenti sospesi in alto)
      let upperItems = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let val = matrix[r][c];
          if (val <= 0) continue;
          let x = (c - cols / 2) * scale;
          let y = (r - rows / 2) * scale;

          let rx = x * cosY - y * sinY;
          let ry = x * sinY + y * cosY;

          let px = cx + rx;
          let py = cy + ry * sinX;
          let depth = ry * cosX;
          let w = scale * 0.95;

          if (val >= 8) {
            // Nuclei intensi (Giallo, Rosso, Magenta): partono dal terreno e salgono solidi
            let height = val * scale * 0.7;
            upperItems.push({
              color: getColor(val),
              depth: depth,
              px: px,
              py_base: py,
              h: height,
              w: w,
              type: 'solid'
            });
          } else {
            // Basse riflettività (Azzurro, Verde): cubi trasparenti sospesi in quota
            let height = val * scale * 0.45;
            let elevationShift = 55 + (val * 3.5);
            upperItems.push({
              color: getColor(val),
              depth: depth,
              px: px,
              py_base: py - elevationShift,
              h: height,
              w: w,
              type: 'transparent'
            });
          }
        }
      }

      upperItems.sort((a, b) => a.depth - b.depth);

      upperItems.forEach(item => {
        if (item.type === 'solid') {
          ctx.fillStyle = item.color;
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.rect(item.px - item.w / 2, item.py_base - item.h, item.w, item.h);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.strokeStyle = item.color;
          ctx.fillStyle = getHoleColor(item.color, 0.25);
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.rect(item.px - item.w / 2, item.py_base - item.h, item.w, item.h);
          ctx.fill();
          ctx.stroke();
        }
      });
    }

    loadMasterData();
    setInterval(loadMasterData, 180000);
  </script>
