<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>M.A.T.S. Regioni - Holographic Wireframe 3D Edition</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #050508;
            color: #f0f0f0;
            overflow: hidden;
        }

        #map { width: 100%; height: 100vh; background: #050508; }

        /* Header Operativo e Menu a Scorrimento */
        .mats-header-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 92%;
            max-width: 850px;
            pointer-events: none;
        }

        .mats-brand {
            background: rgba(8, 8, 12, 0.92);
            padding: 6px 20px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            text-align: center;
            margin-bottom: 6px;
            pointer-events: auto;
        }

        .mats-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffd700, #ff8c00, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }

        .mats-subtitle {
            font-size: 9px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Menu Scorrevole Orizzontale Regioni */
        .regions-slider {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 100%;
            padding: 4px 2px;
            scrollbar-width: none;
            pointer-events: auto;
        }
        .regions-slider::-webkit-scrollbar { display: none; }

        .region-pill {
            background: rgba(15, 15, 20, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #ccc;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .region-pill:hover, .region-pill.active {
            background: #d4af37;
            color: #000;
            border-color: #fff;
            font-weight: 700;
        }

        /* Banner Operativo Inferiore */
        .map-banner {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(8, 8, 12, 0.92);
            padding: 8px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #ddd;
            flex-wrap: wrap;
            gap: 8px;
            pointer-events: auto;
        }

        .counter-badge { font-weight: bold; color: #ffd700; font-size: 13px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #bbb; }

        /* Anelli Centroidi */
        .centroid-ring {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
            animation: ring-pulse 1.5s infinite ease-in-out;
        }
        .centroid-severe {
            border-color: #ff00ff;
            box-shadow: 0 0 16px rgba(255, 0, 255, 0.9);
            animation: severe-pulse 0.8s infinite alternate;
        }

        @keyframes ring-pulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.85); opacity: 0.8; }
        }
        @keyframes severe-pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.35); }
        }

        /* Visore Wireframe 3D Full-Screen */
        #viewer-3d-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050508;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #canvas-3d-container { 
            width: 100%; height: 78vh; display: flex; justify-content: center; align-items: center; cursor: grab; 
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        #canvas-3d-container:active { cursor: grabbing; }
        .modal-info-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(212, 175, 55, 0.08); padding: 10px 16px; border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .close-btn { background: #d4af37; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .controls-hint { position: absolute; bottom: 15px; font-size: 11px; color: #888; text-align: center; letter-spacing: 1px; }

        /* Credits Ancorati in Basso a Destra */
        .source-credits {
            position: absolute; bottom: 6px; right: 10px; z-index: 1000;
            font-size: 9px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.75);
            padding: 3px 6px; border-radius: 4px; pointer-events: auto;
        }
        .source-credits a { color: #d4af37; text-decoration: none; }
    </style>
</head>

    <div class="
