<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>M.A.T.S. - Mesoscale Advanced Tracking System</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000000;
            color: #fff;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Header MATS */
        .mats-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            pointer-events: none;
            background: rgba(10, 10, 10, 0.85);
            padding: 8px 24px;
            border-radius: 24px;
            border: 1px solid rgba(0, 191, 255, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .mats-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00bfff;
        }

        .mats-subtitle {
            font-size: 10px;
            font-weight: 700;
            color: #00bfff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Navbar Regioni Superiore */
        .reg-nav {
            position: absolute;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 92vw;
            padding: 6px 12px;
            background: rgba(15, 15, 15, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            scrollbar-width: none;
        }
        .reg-nav::-webkit-scrollbar { display: none; }

        .reg-btn {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            backdrop-filter: blur(6px);
            display: flex;
            gap: 6px;
            align-items: center;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reg-btn:hover, .reg-btn.active {
            background: rgba(0, 191, 255, 0.25);
            border-color: #00bfff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        /* Banner Inferiore */
        .ncp-banner {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            backdrop-filter: blur(8px);
            display: flex;
            gap: 15px;
            align-items: center;
            white-space: nowrap;
        }

        /* Modulo Viewer 3D */
        #viewer-3d-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-info-bar {
            position: absolute;
            top: 15px;
            left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(15, 15, 15, 0.95);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .meteo-grid-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 12px;
            font-size: 10.5px;
            color: #ddd;
            margin-top: 4px;
        }

        .close-btn {
            background: #ff3b30;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        #canvas-3d-container {
            width: 100%;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            position: relative;
        }
        #canvas-3d-container:active { cursor: grabbing; }

        .holo-toggle-btn {
            position: absolute;
            bottom: 20px;
            background: linear-gradient(45deg, #007fff, #00bfff);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
        }

        .controls-hint {
            position: absolute;
            bottom: 35px;
            font-size: 11px;
            color: #888;
            text-align: center;
        }

        /* Marker Centroide Dinamico */
        .centroid-pulse {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="mats-header">
        <div class="mats-title">M.A.T.S.</div>
        <div class="mats-subtitle">Mesoscale Advanced Tracking System</div>
    </div>

    <div class="reg-nav" id="region-nav-container"></div>

    <div id="map"></div>

    <div class="map banner" class="ncp-banner">
        <span>Strutture 3D: <b id="total-count" style="color:#00bfff;">0</b></span>
        <span>Aggiornato: <b id="last-update">--:--</b></span>
    </div>

    <!-- Modulo Viewer 3D -->
    <div id="viewer-3d-modal">
        <div class="modal-info-bar">
            <div>
                <b id="modal-cell-id" style="font-size: 15px; color: #00bfff;">Core 3D</b>
                <div class="meteo-grid-info" id="modal-cell-details"></div>
            </div>
            <button class="close-btn" onclick="close3DViewer()">CHIUDI [X]</button>
        </div>

        <div id="canvas-3d-container">
            <canvas id="viewer-canvas"></canvas>
            <button class="holo-toggle-btn" id="holo-btn" onclick="toggleHologramMode()">ATTIVA WIREFRAME 3D</button>
            <div class="controls-hint">Trascina per ruotare a 360° | Ancorato al centro</div>
        </div>
    </div>
        <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const regionalList = [
            "Abruzzo", "Basilicata", "Calabria", "Campania", "Emilia-Romagna",
            "Friuli-Venezia Giulia", "Lazio", "Liguria", "Lombardia", "Marche",
            "Molise", "Piemonte", "Puglia", "Sardegna", "Sicilia",
            "Toscana", "Trentino-Alto Adige", "Umbria", "Valle d'Aosta", "Veneto"
        ];

        const regionCoords = {
            "Abruzzo": [42.35, 14.0], "Basilicata": [40.6, 16.5], "Calabria": [39.0, 16.5],
            "Campania": [40.8, 14.2], "Emilia-Romagna": [44.5, 11.3], "Friuli-Venezia Giulia": [46.1, 13.2],
            "Lazio": [41.9, 12.5], "Liguria": [44.4, 8.9], "Lombardia": [45.5, 9.9],
            "Marche": [43.3, 13.5], "Molise": [41.6, 14.7], "Piemonte": [45.1, 7.7],
            "Puglia": [41.1, 16.8], "Sardegna": [40.1, 9.1], "Sicilia": [37.6, 14.0],
            "Toscana": [43.4, 11.2], "Trentino-Alto Adige": [46.3, 11.3], "Umbria": [43.1, 12.4],
            "Valle d'Aosta": [45.7, 7.3], "Veneto": [45.4, 11.8]
        };

        let currentActiveRegion = "Nazionale";
        const regContainer = document.getElementById('region-nav-container');

        const btnNat = document.createElement('button');
        btnNat.className = 'reg-btn active';
        btnNat.innerText = 'Nazionale';
        btnNat.onclick = (e) => filterRegion('Nazionale', [42.5, 12.5], 6);
        regContainer.appendChild(btnNat);

        regionalList.forEach(reg => {
            const btn = document.createElement('button');
            btn.className = 'reg-btn';
            btn.innerText = reg;
            btn.onclick = (e) => filterRegion(reg, regionCoords[reg], 8);
            regContainer.appendChild(btn);
        });

        function filterRegion(regName, coords, zoomLevel) {
            currentActiveRegion = regName;
            document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            map.setView(coords, zoomLevel);
            if (window.lastLoadedData) renderRegionalData(window.lastLoadedData);
        }

        var map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 17,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var radarLayer = L.layerGroup().addTo(map);
        var vectorsLayer = L.layerGroup().addTo(map);

        function getColor(val) {
            if (val >= 14) return '#ff00ff';
            if (val >= 11) return '#ff0000';
            if (val >= 8) return '#ff7700';
            if (val >= 6) return '#ffcc00';
            if (val >= 3) return '#00cc00';
            return '#00bfff';
        }

        function getHoloColor(hex, alpha) {
            if (hex === '#ff00ff') return `rgba(255, 0, 255, ${alpha})`;
            if (hex === '#ff0000') return `rgba(255, 0, 0, ${alpha})`;
            if (hex === '#ff7700') return `rgba(255, 119, 0, ${alpha})`;
            if (hex === '#ffcc00') return `rgba(255, 204, 0, ${alpha})`;
            if (hex === '#00cc00') return `rgba(0, 204, 0, ${alpha})`;
            return `rgba(0, 191, 255, ${alpha})`;
        }

        function getMaxCoreColor(track) {
            let maxVal = 0;
            let matrix = track.grid_matrix || [];
            matrix.forEach(row => {
                row.forEach(val => { if (val > maxVal) maxVal = val; });
            });
            return getColor(maxVal);
        }

        async function loadMasterData() {
            try {
                let res = await fetch('centroids.json?' + Date.now());
                if (!res.ok) throw new Error("Errore dati");
                let data = await res.json();
                window.lastLoadedData = data;
                renderRegionalData(data);
            } catch (err) {
                console.log("In attesa dati...", err);
            }
        }

        function getOffsetLatLng(lat, lon, bearing, distanceKm) {
            const R = 6371;
            const rad = Math.PI / 180;
            const d = distanceKm / R;
            const bng = bearing * rad;
            const lat1 = lat * rad;
            const lon1 = lon * rad;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(bng));
            const lon2 = lon1 + Math.atan2(Math.sin(bng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

            return [lat2 / rad, lon2 / rad];
        }

        function renderRegionalData(data) {
            radarLayer.clearLayers();
            vectorsLayer.clearLayers();

            if (data.radar_tile && data.radar_tile.host && data.radar_tile.path) {
                let radarUrl = data.radar_tile.host + data.radar_tile.path + '/256/5/{x}/{y}/2/1_1.png';
                let rlayer = L.tileLayer(radarUrl, { opacity: 0.65, zIndex: 200 });
                radarLayer.addLayer(rlayer);
            }

            let structures = data.macro_structures || data.structures || [];
            document.getElementById('total-count').innerText = structures.length;
            document.getElementById('last-update').innerText = new Date(data.generated_at || Date.now()).toLocaleTimeString();

            structures.forEach(track => {
                let center = track.center;
                if (!center || center.length < 2) return;

                if (currentActiveRegion !== "Nazionale") {
                    let coords = regionCoords[currentActiveRegion];
                    if (coords) {
                        let dist = Math.abs(center[0] - coords[0]) + Math.abs(center[1] - coords[1]);
                        if (dist > 2.2) return;
                    }
                }

                let coreHexColor = getMaxCoreColor(track);
                let coreRgbaFill = getHoloColor(coreHexColor, 0.22);

                if (track.actual_path && track.actual_path.length > 0) {
                    let fullPath = [center, ...track.actual_path];
                    L.polyline(fullPath, { color: coreHexColor, weight: 4, opacity: 0.85 }).addTo(vectorsLayer);
                }

                let speedKmh = track.speed_kmh || 40;
                let dirDeg = track.direction_deg || 45;
                let lat0 = center[0], lon0 = center[1];

                let predPoints = [[lat0, lon0]];
                let coneLeft = [], coneRight = [];

                for (let h = 1; h <= 6; h++) {
                    let dist = (speedKmh * h);
                    let pos = getOffsetLatLng(lat0, lon0, dirDeg, dist);
                    predPoints.push(pos);

                    let coneRadius = 5 + (h * 6);
                    let leftPt = getOffsetLatLng(pos[0], pos[1], dirDeg - 90, coneRadius);
                    let rightPt = getOffsetLatLng(pos[0], pos[1], dirDeg + 90, coneRadius);

                    coneLeft.push(leftPt);
                    coneRight.unshift(rightPt);

                    if (h === 1 || h === 3 || h === 6) {
                        L.circleMarker(pos, { radius: 4, color: coreHexColor, fillColor: coreHexColor, fillOpacity: 0.9 })
                            .bindTooltip(`+${h}h (${Math.round(dist)}km)`, { permanent: false, direction: 'top' })
                            .addTo(vectorsLayer);
                    }
                }

                let conePolygon = [ [lat0, lon0], ...coneLeft, ...coneRight ];
                L.polygon(conePolygon, {
                    color: coreHexColor,
                    weight: 2,
                    dashArray: '4, 4',
                    fillColor: coreHexColor,
                    fillOpacity: 0.22
                }).addTo(vectorsLayer);

                L.polyline(predPoints, { color: coreHexColor, weight: 2, dashArray: '6, 6' }).addTo(vectorsLayer);

                let centroidIconHtml = `<div class="centroid-pulse" style="background:${coreHexColor}; box-shadow: 0 0 12px ${coreHexColor};"></div>`;
                let centroidIcon = L.divIcon({
                    className: 'custom-centroid-node',
                    html: centroidIconHtml,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });
                let marker = L.marker([center[0], center[1]], { icon: centroidIcon }).addTo(vectorsLayer);
                marker.on('click', () => open3DViewer(track));
            });
        }

        var currentTrack = null;
        var rotX = 0.5, rotY = 0.0, isDragging = false, lastMouseX = 0, lastMouseY = 0;
        var isWireframeMode = false;
        var wireframeAnimId = null;
        var scanAngle = 0;

        function open3DViewer(track) {
            currentTrack = track;
            rotY = 0.0; rotX = 0.5; isWireframeMode = false;
            document.getElementById('holo-btn').innerText = "ATTIVA WIREFRAME 3D";

            let dbzVal = track.dbz || Math.round(42 + Math.round(track.vil || 30) % 15);
            let rainRate = track.rain_rate || Math.round(Math.pow(Math.pow(10, dbzVal / 10) / 200, 0.625) * 10) / 10;
            let echoTopMd = track.echo_top || Math.round(Math.min(13.5, 5.5 + (dbzVal / 9.0) + (track.vil / 50.0)) * 10) / 10;
            let hailRisk = dbzVal >= 52 ? "MOLTO ELEVATO (>85%)" : (dbzVal >= 46 ? "ELEVATO (60-85%)" : (dbzVal >= 40 ? "MODERATO (30-60%)" : "BASSO (<30%)"));
            let hailColor = dbzVal >= 52 ? "#ff00ff" : (dbzVal >= 46 ? "#ff0000" : "#ffcc00");
            let lightningActivity = dbzVal >= 50 ? "EXTREME (>50 sf/min)" : (dbzVal >= 44 ? "INTENSE (20-50 sf/min)" : "MODERATE");

            document.getElementById('modal-cell-id').innerText = `${track.id} | ${dbzVal} dBZ`;
            document.getElementById('modal-cell-details').innerHTML = `
                <div><b>Riflettività Max:</b> <span style="color:${getMaxCoreColor(track)}; font-weight:bold;">${dbzVal} dBZ</span></div>
                <div><b>Rain Rate Previsto:</b> <span style="color:#00bfff;">${rainRate} mm/h</span></div>
                <div><b>VIL Core:</b> ${track.vil || 45} kg/m²</div>
                <div><b>Echo Top (Med):</b> ${echoTopMd} km</div>
                <div><b>Rischio Grandine:</b> <span style="color:${hailColor}; font-weight:bold;">${hailRisk}</span></div>
                <div><b>Attività Fulmini:</b> ${lightningActivity}</div>
                <div><b>Vel. Traslazione:</b> ${track.speed_kmh || 45} km/h</div>
                <div><b>ETA Cono +6h:</b> Target Costiero</div>
            `;

            document.getElementById('viewer-3d-modal').style.display = 'flex';
            render3D();
        }

        function close3DViewer() {
            document.getElementById('viewer-3d-modal').style.display = 'none';
            if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);
            currentTrack = null; isWireframeMode = false;
        }

        function toggleHologramMode() {
            isWireframeMode = !isWireframeMode;
            document.getElementById('holo-btn').innerText = isWireframeMode ? "DISATTIVA WIREFRAME 3D" : "ATTIVA WIREFRAME 3D";
            if (isWireframeMode) {
                runWireframeLoop();
            } else {
                if (wireframeAnimId) cancelAnimationFrame(wireframeAnimId);
                render3D();
            }
        }

        var canvas = document.getElementById('viewer-canvas');
        var ctx = canvas.getContext('2d');
        var container = document.getElementById('canvas-3d-container');

        container.addEventListener('mousedown', e => {
            isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY;
        });
        container.addEventListener('touchstart', e => {
            if (e.touches.length === 1) { isDragging = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; }
        }, { passive: true });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            rotY += (e.clientX - lastMouseX) * 0.01;
            rotX -= (e.clientY - lastMouseY) * 0.008;
            rotX = Math.max(0.2, Math.min(1.2, rotX));
            lastMouseX = e.clientX; lastMouseY = e.clientY;
            if (!isWireframeMode) render3D();
        });

        window.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            let cx = e.touches[0].clientX, cy = e.touches[0].clientY;
            rotY += (cx - lastMouseX) * 0.01;
            rotX -= (cy - lastMouseY) * 0.008;
            rotX = Math.max(0.2, Math.min(1.2, rotX));
            lastMouseX = cx; lastMouseY = cy;
            if (!isWireframeMode) render3D();
        }, { passive: true });

        function render3D() {
            if (!currentTrack) return;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let matrix = currentTrack.grid_matrix || [];
            let rows = matrix.length;
            if (rows === 0) return;
            let cols = matrix[0].length;
            let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
            let scale = Math.min(canvas.width, canvas.height) / 22;
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let columnsToDraw = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = matrix[r][c];
                    if (val <= 0) continue;

                    let x = (c - cols / 2 + 0.5) * 1.0;
                    let y = (r - rows / 2 + 0.5) * 1.0;
                    let px_base = cx + (x * cosY - y * sinY) * scale;
                    let py_base = cy + (x * sinX * sinY + y * sinX * cosY - cosX) * scale;
                    let depth = (x * sinY + y * cosY) * cosX;
                    let h_px = val * scale * 0.75;

                    columnsToDraw.push({
                        color: getColor(val), depth: depth,
                        px_base: px_base, py_base: py_base,
                        px_top: px_base, py_top: py_base - h_px, h_px: h_px
                    });
                }
            }

            columnsToDraw.sort((a, b) => a.depth - b.depth);
            let barW = scale * 0.85;

            columnsToDraw.forEach(col => {
                ctx.fillStyle = col.color;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.rect(col.px_base - barW / 2, col.py_top, barW, col.h_px);
                ctx.fill();
                ctx.stroke();
            });
        }

        function runWireframeLoop() {
            if (!isWireframeMode) return;
            scanAngle += 0.03;
            rotY += 0.008;

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let matrix = currentTrack.grid_matrix || [];
            let rows = matrix.length;
            if (rows === 0) return;
            let cols = matrix[0].length;
            let cx = canvas.width / 2, cy = canvas.height / 2 + 50;
            let scale = Math.min(canvas.width, canvas.height) / 22;
            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let columnsToDraw = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = matrix[r][c];
                    if (val <= 0) continue;

                    let x = (c - cols / 2 + 0.5) * 1.0;
                    let y = (r - rows / 2 + 0.5) * 1.0;
                    let px_base = cx + (x * cosY - y * sinY) * scale;
                    let py_base = cy + (x * sinX * sinY + y * sinX * cosY - cosX) * scale;
                    let depth = (x * sinY + y * cosY) * cosX;
                    let h_px = val * scale * 0.75;

                    columnsToDraw.push({
                        color: getColor(val), depth: depth,
                        px_base: px_base, py_base: py_base,
                        px_top: px_base, py_top: py_base - h_px, h_px: h_px
                    });
                }
            }

            columnsToDraw.sort((a, b) => a.depth - b.depth);
            let barW = scale * 0.85;

            columnsToDraw.forEach(col => {
                ctx.fillStyle = getHoloColor(col.color, 0.19);
                ctx.strokeStyle = getHoloColor(col.color, 0.65);
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.rect(col.px_base - barW / 2, col.py_top, barW, col.h_px);
                ctx.fill();
                ctx.stroke();
            });

            let scanY = cy + Math.sin(scanAngle * 2) * 90;
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(cx - 100, scanY);
            ctx.lineTo(cx + 100, scanY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            wireframeAnimId = requestAnimationFrame(runWireframeLoop);
        }

        loadMasterData();
        setInterval(loadMasterData, 60000);
    </script>
</body>
</html>
